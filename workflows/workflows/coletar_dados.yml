name: Coletar Dados Meteomatics

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  baixar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - env:
          METEOMATICS_SENHA: ${{ secrets.METEOMATICS_SENHA }}
        run: python baixar_dados.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add cache_huambo.csv
          git commit -m "Atualiza cache climático do Huambo" || exit 0
          git push
